name: CI/CD & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  quality:
    name: 🧪 Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate (typecheck, lint, img attrs)
        run: npm run validate

      - name: Unit, integration & property tests
        run: npm test

      - name: npm audit (production, high severity)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run db:rebuild

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        env:
          NODE_ENV: test
          CI: "true"
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  release-windows:
    name: 🚀 Package Windows
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, e2e]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Package Windows (zip)
        run: npm run dist:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit release artifact for sensitive data
        run: npm run check:release-artifacts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/RuleDesk-*-win.zip
          if-no-files-found: error

  release-linux:
    name: 🚀 Package Linux
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install AppImage dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run db:rebuild

      - name: Package Linux (AppImage)
        run: npm run dist:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit release artifact for sensitive data
        run: npm run check:release-artifacts

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*.AppImage
          if-no-files-found: error

  release-publish:
    name: 🚀 Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-windows, release-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
